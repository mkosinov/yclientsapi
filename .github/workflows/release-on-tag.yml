name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release-on-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: |
          poetry install --no-root

      - name: Extract version from tag
        id: extract_version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV

      - name: Update pyproject.toml version
        run: |
          sed -i.bak "s/^version = \".*\"/version = \"$TAG_VERSION\"/" pyproject.toml

      - name: Build package
        run: |
          poetry build

      - name: Publish to PyPI
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        run: |
          poetry publish --username __token__ --password $POETRY_PYPI_TOKEN_PYPI

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

      - name: Notify on success && success()
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'v${{ github.ref_name }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: `:tada: Release ${tag} published successfully to PyPI!`
            });

      - name: Notify on failure && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'v${{ github.ref_name }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: `:x: Release ${tag} failed. Please check the workflow logs.`
            });
