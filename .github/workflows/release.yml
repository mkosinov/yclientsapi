name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: |
          poetry install --no-root

      - name: Build package
        run: |
          poetry build

      - name: Extract changelog for release
        id: changelog
        run: |
          VERSION=$(echo "${GITHUB_REF#refs/tags/}")
          awk "/^##? \[?${VERSION//./\\.}?\]?/ {flag=1; next} /^##? / {flag=0} flag" CHANGELOG.md > RELEASE_CHANGELOG.md
        shell: bash

      - name: Publish to PyPI
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        run: |
          poetry publish --username __token__ --password $POETRY_PYPI_TOKEN_PYPI

      - name: Create GitHub Release with changelog
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_CHANGELOG.md

      - name: Notify on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: `:tada: Release ${tag} published successfully to PyPI!`
            });

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: `:x: Release ${tag} failed. Please check the workflow logs.`
            }); 