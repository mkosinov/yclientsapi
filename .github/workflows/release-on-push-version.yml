name: Release on Push Version

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write

jobs:
  release-on-push-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | head -1 | cut -d '"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          git fetch --tags
          if git rev-parse "v${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag already exists."
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.check_tag.outputs.tag_exists == 'false'
        uses: rickstaa/action-create-tag@v1
        with:
          tag: v${{ steps.get_version.outputs.version }}
          message: "Release v${{ steps.get_version.outputs.version }}"

      - name: Set release_needed output
        id: release_needed
        run: |
          if [ "${{ steps.check_tag.outputs.tag_exists }}" = "false" ]; then
            echo "release_needed=true" >> $GITHUB_OUTPUT
          else
            echo "release_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Poetry
        if: steps.release_needed.outputs.release_needed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        if: steps.release_needed.outputs.release_needed == 'true'
        run: |
          poetry install --no-root

      - name: Build package
        if: steps.release_needed.outputs.release_needed == 'true'
        run: |
          poetry build

      - name: Extract changelog for release
        if: steps.release_needed.outputs.release_needed == 'true'
        id: changelog
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          awk "/^##? \[?$VERSION\]?/ {flag=1; next} /^##? / {flag=0} flag" CHANGELOG.md > RELEASE_CHANGELOG.md
        shell: bash

      - name: Publish to PyPI
        if: steps.release_needed.outputs.release_needed == 'true'
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        run: |
          poetry publish --username __token__ --password $POETRY_PYPI_TOKEN_PYPI

      - name: Create GitHub Release with changelog
        if: steps.release_needed.outputs.release_needed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_CHANGELOG.md
          tag_name: v${{ steps.get_version.outputs.version }}

      - name: Notify on success
        if: steps.release_needed.outputs.release_needed == 'true' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'v${{ steps.get_version.outputs.version }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: `:tada: Release ${tag} published successfully to PyPI!`
            });

      - name: Notify on failure
        if: steps.release_needed.outputs.release_needed == 'true' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'v${{ steps.get_version.outputs.version }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: `:x: Release ${tag} failed. Please check the workflow logs.`
            });
